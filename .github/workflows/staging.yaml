name: CI/CD Pipeline

on:
  push:
    branches:
      - "*"
      - "!master"

jobs:
  prepare:
    runs-on: self-hosted
    name: Prepare
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Get app name
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          REPO_NAME=${{ github.event.repository.name }}

          # Check if the branch name is "master"
          if [ $BRANCH_NAME = "master" ]; then
            APP_NAME=$REPO_NAME
          else
            APP_NAME="${REPO_NAME}-stage"
          fi

          echo "APP_NAME=$APP_NAME" >> vars.env
          echo $APP_NAME
      - name: Generate swagger
        run: |
          ls

      - name: Import Secrets
        uses: hashicorp/vault-action@v2.7.4
        id: import-secrets
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
        with:
          url: http://localhost:8200
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secrets/stg/${{ github.event.repository.name }}/pg-dsn pg-dsn | PG_DSN;

      - name: Save secrets
        run: |
          echo "PG_DSN=${{ steps.import-secrets.outputs.PG_DSN }}" >> vars.env

  clean:
    runs-on: self-hosted
    name: Clean
    needs: prepare
    steps:
      - name: Remove container and image
        run: |
          source vars.env

          if docker inspect $APP_NAME > /dev/null 2>&1; then docker rm -f $APP_NAME && docker rmi -f $APP_NAME; else echo "Container not found."; fi
  build:
    runs-on: self-hosted
    name: Build
    needs: clean
    steps:
      - name: Build binary
        run: |
          GOARCH=amd64 GOOS=linux go build -o ./bin/main ./cmd/${{ github.event.repository.name }}

  migrations:
    runs-on: self-hosted
    name: Migrations stage
    needs: build
    steps:
      - name: Run migrations
        run: |
          source vars.env

          export GOBIN=/home/fidesy/go/bin
          export PATH=$PATH:$GOBIN

          goose -dir ./migrations postgres $PG_DSN up

  deploy:
    runs-on: self-hosted
    name: Deploy
    needs: migrations
    steps:
      - name: Build and run docker container
        run: |
          source vars.env

           # generate random ports
          GRPC_PORT=$((RANDOM % (65000 - 5000 + 1) + 5000))
          METRICS_PORT=40801

          docker build --tag $APP_NAME .

          docker run --name $APP_NAME -d \
            --restart always \
            --network zoo \
            -e PG_DSN=$PG_DSN \
            -e APP_NAME=$APP_NAME \
            -e ENV=STAGING \
            -e GRPC_PORT=$GRPC_PORT -p $GRPC_PORT:$GRPC_PORT \
            -e METRICS_PORT=$METRICS_PORT -p $METRICS_PORT:$METRICS_PORT \
             $APP_NAME

  e2e-tests:
    runs-on: self-hosted
    name: E2E tests
    needs: deploy
    steps:
      - name: Get and run tests
        run: |
          rm -rf e2e-tests
          git clone git@github.com:fidesy-pay/e2e-tests.git
          cd e2e-tests
          go clean -testcache
          go test -v ./internal/tests/...
